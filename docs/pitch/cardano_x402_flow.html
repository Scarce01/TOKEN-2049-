<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qu3ee on Cardano: x402 paid trace</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0d10; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    svg { width: 1280px; height: 720px; display: block; }
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cardano-x402-flow-title cardano-x402-flow-desc">
  <title id="cardano-x402-flow-title">Qu3ee buys a forensic trace, per call, on Cardano</title>
  <desc id="cardano-x402-flow-desc">Sequence diagram of the x402 payment on Cardano Preprod: the Qu3ee Investigator requests a trace, receives HTTP 402 terms of 1 tADA, signs a transaction, and retries; the Cardano Foundation facilitator verifies and settles it on chain, and the Trace Agent returns the trace with a payment receipt.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9adb5"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e2b52e"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
  </defs>

  <rect width="1280" height="720" fill="#0b0d10"/>

  <text x="40" y="44" fill="#e2b52e" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">QU3EE ON CARDANO · X402 · PREPROD</text>
  <text x="40" y="88" fill="#f2efe6" font-size="40" font-family="'Instrument Serif', serif">Qu3ee buys a forensic trace, per call</text>

  <!-- lifelines -->
  <g stroke="#f2efe6" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4,6">
    <line x1="180" y1="164" x2="180" y2="700"/>
    <line x1="520" y1="164" x2="520" y2="700"/>
    <line x1="840" y1="164" x2="840" y2="700"/>
    <line x1="1120" y1="164" x2="1120" y2="700"/>
  </g>

  <!-- actors -->
  <rect x="60" y="108" width="240" height="56" rx="6" fill="#e2b52e" fill-opacity="0.14" stroke="#e2b52e" stroke-width="1.6"/>
  <text x="180" y="132" fill="#f2efe6" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qu3ee Investigator</text>
  <text x="180" y="152" fill="#e2b52e" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">agent · holds the key</text>

  <rect x="400" y="108" width="240" height="56" rx="6" fill="#14171c" stroke="#f2efe6" stroke-opacity="0.55" stroke-width="1.2"/>
  <text x="520" y="132" fill="#f2efe6" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trace Agent</text>
  <text x="520" y="152" fill="#a9adb5" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">seller · no key</text>

  <rect x="720" y="108" width="240" height="56" rx="6" fill="#6a95d8" fill-opacity="0.08" stroke="#6a95d8" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="840" y="132" fill="#f2efe6" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Facilitator</text>
  <text x="840" y="152" fill="#6a95d8" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Cardano Foundation</text>

  <rect x="1000" y="108" width="240" height="56" rx="6" fill="#6a95d8" fill-opacity="0.08" stroke="#6a95d8" stroke-opacity="0.8" stroke-width="1.2"/>
  <text x="1120" y="132" fill="#f2efe6" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cardano Preprod</text>
  <text x="1120" y="152" fill="#6a95d8" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">L1 · eUTxO</text>

  <!-- messages -->
  <line x1="180" y1="204" x2="518" y2="204" stroke="#a9adb5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="240" x2="182" y2="240" stroke="#a9adb5" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="180" y1="320" x2="518" y2="320" stroke="#e2b52e" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="520" y1="356" x2="838" y2="356" stroke="#6a95d8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <line x1="520" y1="560" x2="838" y2="560" stroke="#6a95d8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <line x1="840" y1="592" x2="1118" y2="592" stroke="#6a95d8" stroke-width="2" marker-end="url(#arrow-link)"/>
  <line x1="1120" y1="624" x2="842" y2="624" stroke="#6a95d8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-link)"/>
  <line x1="840" y1="656" x2="522" y2="656" stroke="#6a95d8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-link)"/>
  <line x1="520" y1="688" x2="182" y2="688" stroke="#e2b52e" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- message labels -->
  <g font-size="16" font-family="'Geist Mono', monospace" text-anchor="middle">
    <rect x="236" y="180" width="228" height="16" rx="2" fill="#0b0d10"/>
    <text x="350" y="192" fill="#a9adb5">GET /api/trace/:address</text>
    <rect x="212" y="216" width="276" height="16" rx="2" fill="#0b0d10"/>
    <text x="350" y="228" fill="#a9adb5">402 PAYMENT-REQUIRED: 1 tADA</text>
    <rect x="228" y="296" width="244" height="16" rx="2" fill="#0b0d10"/>
    <text x="350" y="308" fill="#e2b52e">retry + PAYMENT-SIGNATURE</text>
    <rect x="644" y="332" width="72" height="16" rx="2" fill="#0b0d10"/>
    <text x="680" y="344" fill="#6a95d8">/verify</text>
    <rect x="644" y="536" width="72" height="16" rx="2" fill="#0b0d10"/>
    <text x="680" y="548" fill="#6a95d8">/settle</text>
    <rect x="932" y="568" width="96" height="16" rx="2" fill="#0b0d10"/>
    <text x="980" y="580" fill="#6a95d8">submit tx</text>
    <rect x="928" y="600" width="104" height="16" rx="2" fill="#0b0d10"/>
    <text x="980" y="612" fill="#6a95d8">confirmed</text>
    <rect x="596" y="632" width="168" height="16" rx="2" fill="#0b0d10"/>
    <text x="680" y="644" fill="#6a95d8">success · tx hash</text>
    <rect x="212" y="664" width="276" height="16" rx="2" fill="#0b0d10"/>
    <text x="350" y="676" fill="#e2b52e">200 trace + PAYMENT-RESPONSE</text>
  </g>

  <!-- notes -->
  <rect x="60" y="256" width="240" height="32" rx="4" fill="#14171c" stroke="#e2b52e" stroke-opacity="0.6" stroke-width="1"/>
  <text x="180" y="278" fill="#f2efe6" font-size="16" font-family="'Geist Mono', monospace" text-anchor="middle">auto ≤ 1 tADA · sign tx</text>

  <rect x="680" y="372" width="320" height="112" rx="4" fill="#14171c" stroke="#6a95d8" stroke-opacity="0.6" stroke-width="1"/>
  <g font-size="16" font-family="'Geist Mono', monospace" text-anchor="middle">
    <text x="840" y="396" fill="#f2efe6">network · witnesses · TTL</text>
    <text x="840" y="416" fill="#f2efe6">nonce in inputs, unspent</text>
    <text x="840" y="436" fill="#f2efe6">fee · value · min UTxO</text>
    <text x="840" y="456" fill="#f2efe6">recipient · asset · amount</text>
    <text x="840" y="476" fill="#f0646a">any fail → 402 + reason</text>
  </g>

  <rect x="360" y="496" width="320" height="32" rx="4" fill="#14171c" stroke="#f2efe6" stroke-opacity="0.4" stroke-width="1"/>
  <text x="520" y="518" fill="#f2efe6" font-size="16" font-family="'Geist Mono', monospace" text-anchor="middle">trace(addr) · 404 → no settle</text>
</svg>
</body>
</html>
