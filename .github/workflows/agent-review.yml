name: agent-review
# Two review agents on every PR: alignment (design and interfaces) and web3 security.
# Definitions live in .claude/agents/ so teammates can run the same checks locally in Claude Code.
# Needs repo secret ANTHROPIC_API_KEY; without it the job skips (never blocks merging).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Runs on non-draft PRs, or when someone comments "/review" on a PR.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - id: key
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$K" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::ANTHROPIC_API_KEY not set, skipping agent review"; fi
      - if: steps.key.outputs.ok
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: steps.key.outputs.ok
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request. Get the diff with `gh pr diff <PR NUMBER>` and the file list with
            `gh pr view <PR NUMBER> --json files,title,body,author`.

            1. Run the `alignment-reviewer` subagent on the diff (always).
            2. Run the `web3-auditor` subagent if any changed path is under contracts/, workflows/ or packages/shared/.

            Post exactly one PR comment with `gh pr comment <PR NUMBER> --body-file <file>` containing:
            - heading `## Agent review`
            - the alignment section, then the security section (or one line saying it was skipped and why)
            Write in Chinese. Keep it short. Do not post anything else, do not approve or request changes.
          claude_args: >-
            --max-turns 40
            --allowedTools "Task,Read,Grep,Glob,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
